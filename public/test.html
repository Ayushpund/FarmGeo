<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmGeo Test</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #34ae6f;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .status {
            background: #e1f8e8;
            color: #34ae6f;
            padding: 10px 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✅ Server is Running!</h1>
        <div class="status">HTTP Server: Active</div>
        <p>
            If you can see this page, your Vite dev server is working correctly.
            The issue is with the React application loading.
        </p>
        <p style="margin-top: 20px; font-size: 14px; color: #999;">
            Please refresh your browser with <strong>Ctrl+Shift+R</strong> (Windows) or <strong>Cmd+Shift+R</strong>
            (Mac)
            to clear the cache and load the React app.
        </p>
    </div>
</body>

</html>
